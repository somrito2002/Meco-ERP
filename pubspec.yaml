name: meco
description: "ERP of Meco concepts"
publish_to: 'none'

# ============================================================
# MECO APPLICATION VERSION
# ============================================================
#
# Format:
# MAJOR.MINOR.PATCH+BUILD
#
# Current version:
# 1.0.0 = Initial official stable release
# +1     = Build number
#
# UI displays only:
# Version 1.0.0
#
# Semantic Versioning:
# MAJOR  -> Major/breaking release
# MINOR  -> New backward-compatible features
# PATCH  -> Bug fixes and small improvements
#
# Examples:
# 1.0.0 -> Initial stable release
# 1.0.1 -> Bug fix
# 1.1.0 -> New feature
# 1.1.1 -> Bug fix after feature
# 2.0.0 -> Major/breaking release
#
version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

  # Department dropdown / custom dropdown functionality
  dropdown_button2: ^3.1.0

  # Dynamically retrieves app version and build information
  package_info_plus: ^10.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Generates Android/iOS launcher icons
  flutter_launcher_icons: ^0.14.4

  # Recommended Flutter lint rules
  flutter_lints: ^6.0.0

# ============================================================
# FLUTTER CONFIGURATION
# ============================================================

flutter:
  uses-material-design: true

  assets:
    - assets/logo/MECO TECHNOLOGIES PR-Photoroom.png

# ============================================================
# MECO LAUNCHER ICON
# ============================================================
#
# IMPORTANT:
# The uploaded Meco logo is the actual launcher artwork.
#
# Do NOT add:
# - white background
# - black background
# - circular background
# - border
# - shadow
# - glow
#
# The transparent area around the logo should remain transparent
# wherever the Android launcher supports it.
#
flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true

  # Premium dark-background Meco globe app icon
  image_path: "assets/icon/App icon.png"

  # Android adaptive icon — background matches icon's dark border colour
  adaptive_icon_background: "#1A1D23"
  adaptive_icon_foreground: "assets/icon/App icon.png"

  min_sdk_android: 21
